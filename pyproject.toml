[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compactHxRG"
dynamic = ["version"]
description = "Rewrite HxRG ramp-fit FITS files (slope, intercept, errors, n) about 5 times smaller, as small integers with BSCALE/BZERO."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Etienne Artigau"}]
dependencies = [
  "numpy>=1.22",
  "astropy>=5.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/eartigau/compactHxRG"

[project.scripts]
compactHxRG = "compacthxrg.cli:main"

[tool.setuptools]
packages = ["compacthxrg"]

[tool.setuptools.dynamic]
version = {attr = "compacthxrg.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
