[metadata]
name = compactHxRG
version = attr: compacthxrg.__version__
description = Rewrite HxRG ramp-fit FITS files (slope, intercept, errors, n) about 5 times smaller, as small integers with BSCALE/BZERO.
long_description = file: README.md
long_description_content_type = text/markdown
author = Etienne Artigau
url = https://github.com/eartigau/compactHxRG

[options]
packages = compacthxrg
python_requires = >=3.6
install_requires =
    numpy>=1.18
    astropy>=4.0

[options.extras_require]
test = pytest

[options.entry_points]
console_scripts =
    compactHxRG = compacthxrg.cli:main

[tool:pytest]
testpaths = tests
addopts = -q
